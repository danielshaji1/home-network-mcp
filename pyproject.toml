[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netwarden"
version = "1.0.0"
description = "Intelligent Multi-Brand Home Network MCP Agent & Terraform Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Daniel Shaji"}
]
keywords = ["mcp", "networking", "terraform", "unifi", "mikrotik", "opnsense", "pihole", "ai-agent"]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
netwarden = "netwarden.cli:main"
netwarden-mcp = "mcp_server:main"
